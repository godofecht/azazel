name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Pinned because the CUE export is part of Azazel's build-model contract.
  CUE_VERSION: v0.16.0

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zig: ["0.14.1", "0.15.2", "0.16.0"]
    name: build-and-test (zig ${{ matrix.zig }})
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}

      - name: Install cue
        run: |
          curl -fsSL -o cue.tar.gz \
            "https://github.com/cue-lang/cue/releases/download/${CUE_VERSION}/cue_${CUE_VERSION}_linux_amd64.tar.gz"
          tar -xzf cue.tar.gz cue
          sudo mv cue /usr/local/bin/
          rm cue.tar.gz
          cue version

      - name: Validate CLI and exported build contract
        run: |
          python3 -m py_compile azazel
          python3 azazel check

      # build_spec.zig is generated from project.cue and is gitignored, so a
      # fresh clone has to produce it before anything will build.
      - name: Generate build spec through the canonical CLI
        run: python3 azazel gen

      # Force a real second generation. gen_build_spec.sh memoizes unchanged
      # inputs, so deleting the stamp is required for this to test determinism.
      - name: Check the generator is deterministic
        run: |
          cp build_spec.zig build_spec.first
          rm -f .build_spec.stamp
          python3 azazel gen
          diff -u build_spec.first build_spec.zig \
            || { echo "gen_build_spec.sh is not deterministic"; exit 1; }
          rm build_spec.first

      - name: Build through the canonical CLI
        run: python3 azazel build

      - name: Test
        run: zig build test --summary all
